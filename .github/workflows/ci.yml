name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: isomorf
          POSTGRES_PASSWORD: isomorf
          POSTGRES_DB: isomorf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isomorf -d isomorf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy (advisory)
        run: mypy app
        continue-on-error: true

      - name: Pytest with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://isomorf:isomorf@localhost:5432/isomorf_test
          JWT_SECRET_KEY: ci-test-secret-key
        run: pytest --cov=app/services --cov-report=term-missing
